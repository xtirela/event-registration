name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '25'

jobs:
  detect-services:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        run: |
          ALL=$(find . -maxdepth 2 -name gradlew -exec dirname {} \; \
                | cut -d/ -f2 | sort -u | jq -R -s -c 'split("\n")[:-1]')

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "services=$ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE...HEAD" \
                | grep -oE '^(api-gateway|event-service|event-registration-service|notification-service|participant-service|user-service)' \
                | sort -u)

          if [ -z "$CHANGED" ]; then
            echo "services=" >> "$GITHUB_OUTPUT"
          else
            echo "services=$(echo "$CHANGED" | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: detect-services
    if: needs.detect-services.outputs.services != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-services.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Build (checkstyle + spotless + jar)
        working-directory: ${{ matrix.service }}
        run: ./gradlew build -x test

      - name: Contract tests (WireMock, no compose stack)
        working-directory: ${{ matrix.service }}
        run: ./gradlew test --tests '*FeignTests' --tests '*Resilience4jTests'