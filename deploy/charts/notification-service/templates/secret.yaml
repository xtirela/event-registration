# Placeholder; consumed by the pod only when values.secrets.resendApiKey is set.
# Otherwise the app reads resend.api-key from Vault (authoritative source).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "notification-service.fullname" . }}
  namespace: eventreg
type: Opaque
stringData:
  resend-api-key: {{ .Values.secrets.resendApiKey | quote }}