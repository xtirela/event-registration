apiVersion: v1
kind: Service
metadata:
  name: {{ include "notification-service.fullname" . }}
  namespace: eventreg
  labels:
    app: {{ include "notification-service.fullname" . }}
spec:
  type: ClusterIP
  selector:
    app: {{ include "notification-service.fullname" . }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      name: http