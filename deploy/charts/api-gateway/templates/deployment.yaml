apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api-gateway.fullname" . }}
  namespace: eventreg
  labels:
    app: {{ include "api-gateway.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "api-gateway.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "api-gateway.fullname" . }}
    spec:
      serviceAccountName: {{ include "api-gateway.fullname" . }}
      containers:
        - name: api-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          env:
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: {{ .Values.keycloak.issuerUri | quote }}
            - name: USER_SERVICE_URL
              value: {{ .Values.userServiceUrl | quote }}
            - name: PARTICIPANT_SERVICE_URL
              value: {{ .Values.participantServiceUrl | quote }}
            - name: EVENT_SERVICE_URL
              value: {{ .Values.eventServiceUrl | quote }}
            - name: EVENT_REGISTRATION_SERVICE_URL
              value: {{ .Values.eventRegistrationServiceUrl | quote }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.service.port }}
            initialDelaySeconds: 25
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.service.port }}
            initialDelaySeconds: 25
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}